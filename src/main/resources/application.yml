server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.casy.casyaiagent.controller
# knife4j http://localhost:8123/api/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# LoveApp 对话记忆配置
loveapp:
  chat:
    memory:
      type: in-memory  # 可选值: in-memory (内存,无需数据库), jdbc (数据库存储)
      max-messages: 10  # 最大保留消息数量

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils:

# Offer邮件配置
